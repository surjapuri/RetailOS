events { worker_connections 1024; }

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile     on;
  gzip         on;
  gzip_types   text/plain application/json application/javascript text/css;
  gzip_min_length 1000;

  upstream node_api {
    server node-api:4000;
    keepalive 32;
  }
  upstream python_api {
    server python-api:8000;
    keepalive 16;
  }

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name api.retailos.app;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 5m;
    proxy_read_timeout   60s;
    proxy_send_timeout   60s;

    # Health
    location /health { proxy_pass http://node_api; }

    # Webhooks (no rate limit — externally called by payment gateways)
    location /webhooks/ {
      proxy_pass http://node_api;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Auth endpoints — stricter rate limit
    location /api/v1/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://node_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Node.js API (POS, CRM, Payments, etc.)
    location /api/v1/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://node_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Python API (B2B, AI)
    location /api/v1/b2b/ { proxy_pass http://python_api; }
    location /api/v1/ai/  { proxy_pass http://python_api; }
    location /api/v1/ads/trust-scores/ { proxy_pass http://python_api; }

    # Socket.io
    location /socket.io/ {
      proxy_pass http://node_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_cache_bypass $http_upgrade;
    }
  }
}
