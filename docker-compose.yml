version: '3.9'

services:
  # ─────────────────────────────────────────
  # PostgreSQL + PostGIS
  # ─────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4
    container_name: retailos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-retailos}
      POSTGRES_USER: ${DB_USER:-retailos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-retailos_user} -d ${DB_NAME:-retailos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retailos_net

  # ─────────────────────────────────────────
  # Redis (Cache + Queue + Pub/Sub)
  # ─────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: retailos_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - retailos_net

  # ─────────────────────────────────────────
  # Node.js API (Express + Socket.io)
  # ─────────────────────────────────────────
  node-api:
    build:
      context: ./backend/node-api
      dockerfile: Dockerfile
      target: production
    container_name: retailos_node_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?required}
      JWT_SUPER_ADMIN_SECRET: ${JWT_SUPER_ADMIN_SECRET:?required}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN}
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY}
      PYTHON_API_URL: http://python-api:8000
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/node-api/logs:/app/logs
    networks:
      - retailos_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────
  # Python FastAPI (B2B Aggregator + AI)
  # ─────────────────────────────────────────
  python-api:
    build:
      context: ./backend/python-api
      dockerfile: Dockerfile
    container_name: retailos_python_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      UDAAN_CLIENT_ID: ${UDAAN_CLIENT_ID}
      UDAAN_CLIENT_SECRET: ${UDAAN_CLIENT_SECRET}
      JIOMART_API_KEY: ${JIOMART_API_KEY}
      SECRET_KEY: ${PYTHON_SECRET_KEY:?required}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - retailos_net

  # ─────────────────────────────────────────
  # Celery Worker (Python async tasks)
  # ─────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend/python-api
      dockerfile: Dockerfile
    container_name: retailos_celery_worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      FCM_SERVER_KEY: ${FCM_SERVER_KEY}
      WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN}
    depends_on:
      - redis
      - postgres
    networks:
      - retailos_net

  # ─────────────────────────────────────────
  # Celery Beat (Scheduler)
  # ─────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend/python-api
      dockerfile: Dockerfile
    container_name: retailos_celery_beat
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      - redis
      - postgres
    networks:
      - retailos_net

  # ─────────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: retailos_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - node-api
      - python-api
    networks:
      - retailos_net

volumes:
  postgres_data:
  redis_data:
  nginx_logs:

networks:
  retailos_net:
    driver: bridge
