name: retailos
description: RetailOS - The Kirana Super-App
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.1

  # Network
  dio: ^5.4.0
  socket_io_client: ^2.0.3+1

  # Local storage (offline-first)
  sqflite: ^2.3.2
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2

  # Hardware
  flutter_blue_plus: ^1.29.2
  usb_serial: ^0.4.0
  esc_pos_utils_plus: ^3.0.0
  esc_pos_printer_plus: ^3.0.0
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  mobile_scanner: ^4.0.1
  local_auth: ^2.1.7

  # Maps & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  flutter_map_marker_cluster: ^1.3.2

  # UI & UX
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  fl_chart: ^0.67.0
  intl: ^0.19.0
  timeago: ^3.6.1
  pull_to_refresh: ^2.0.0

  # Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^16.3.0

  # Auth
  otplib: ^0.1.0

  # Utilities
  flutter_tts: ^3.8.5
  uuid: ^4.3.3
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  image_picker: ^1.0.7
  file_picker: ^6.2.1
  url_launcher: ^6.2.5
  share_plus: ^7.2.2
  pdf: ^3.10.8
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
